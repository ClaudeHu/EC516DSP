<h2 class="sr-only">Interactive convolution of guitar plucks x[k] with a hall impulse response h[n-k], showing each output sample y[n] being built.</h2>
<style>
.lbl{font-size:13px;fill:var(--text-secondary)}
.val{font-size:11px;fill:var(--text-secondary)}
.ax{stroke:var(--border-strong);stroke-width:1}
</style>
<div style="display:flex;align-items:center;gap:12px;margin:0.5rem 0 1rem;">
  <label for="nsl" style="font-size:14px;color:var(--text-secondary);">Output time n</label>
  <input type="range" min="-1" max="5" step="1" value="2" id="nsl" style="flex:1;" />
  <span id="nout" style="font-size:14px;font-weight:500;min-width:20px;">2</span>
  <button id="play" aria-label="Play animation"><i class="ti ti-player-play" aria-hidden="true"></i></button>
</div>
<svg id="sv" viewBox="0 0 680 420" width="100%" role="img" aria-label="Three stem plots: guitar input, flipped and shifted hall response, and output"></svg>
<div id="eq" style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);background:var(--surface-1);border-radius:var(--radius);padding:10px 14px;margin-top:0.5rem;"></div>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:10px;">
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#534AB7;margin-right:6px;"></span>x[k] guitar plucks</span>
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1D9E75;margin-right:6px;"></span>h[n−k] hall echoes (flipped, shifted)</span>
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#D85A30;margin-right:6px;"></span>y[n] recorded sound</span>
</div>
<script>
const x={0:1,1:0,2:0.5},h={0:1,1:0.6,2:0.3};
const yv=[1,0.6,0.8,0.3,0.15];
const kmin=-3,kmax=6,L=90,W=560,sx=W/(kmax-kmin);
const px=k=>L+(k-kmin)*sx+sx/2;
const sv=document.getElementById('sv'),sl=document.getElementById('nsl');
const f=v=>(Math.round(v*100)/100).toString();
function panel(y0,title,vals,col,axisLbl,hl){
  let s=`<text class="lbl" x="10" y="${y0-50}">${title}</text>`;
  s+=`<line class="ax" x1="${L}" x2="${L+W}" y1="${y0}" y2="${y0}"/>`;
  for(let k=kmin;k<=kmax;k++){
    s+=`<text class="val" x="${px(k)}" y="${y0+16}" text-anchor="middle">${k}</text>`;
    const v=vals[k]||0;
    if(v!==undefined&&(k in vals)){
      const top=y0-v*55;
      const op=hl&&hl(k)?1:0.9;
      s+=`<line x1="${px(k)}" x2="${px(k)}" y1="${y0}" y2="${top}" stroke="${col}" stroke-width="2" opacity="${op}"/>`;
      s+=`<circle cx="${px(k)}" cy="${top}" r="5" fill="${col}"/>`;
      if(v!==0) s+=`<text class="val" x="${px(k)+8}" y="${top-4}">${f(v)}</text>`;
    }
  }
  s+=`<text class="val" x="${L+W+6}" y="${y0+4}">${axisLbl}</text>`;
  return s;
}
function draw(n){
  document.getElementById('nout').textContent=n;
  const hs={};for(let k=kmin;k<=kmax;k++){if((n-k) in h)hs[k]=h[n-k];}
  const ys={};for(let i=0;i<=Math.min(n,4);i++)ys[i]=yv[i];
  let s='';
  const ov=[];for(let k=0;k<=2;k++){if(k in hs)ov.push(k);}
  ov.forEach(k=>{s+=`<rect x="${px(k)-sx/2+4}" y="20" width="${sx-8}" height="240" rx="4" fill="var(--bg-accent)" opacity="0.5"/>`;});
  s+=panel(90,'Guitar plucks x[k]',x,'#534AB7','k');
  s+=panel(220,`Hall echoes flipped and shifted h[${n}−k]`,hs,'#1D9E75','k');
  s+=panel(360,'Recording y[n]',ys,'#D85A30','n');
  if(n>=0&&n<=4){const top=360-yv[n]*55;s+=`<circle cx="${px(n)}" cy="${top}" r="9" fill="none" stroke="#D85A30" stroke-width="1.5"/>`;}
  sv.innerHTML=s;
  const terms=ov.map(k=>`x[${k}]·h[${n-k}] = ${f(x[k])}×${f(h[n-k])}`);
  const val=ov.reduce((a,k)=>a+x[k]*h[n-k],0);
  document.getElementById('eq').innerHTML= terms.length? `y[${n}] = `+terms.map(t=>t.split(' = ')[1]).join(' + ')+` = <b style="font-weight:500">${f(val)}</b><br><span style="color:var(--text-secondary)">overlapping terms: ${terms.map(t=>t.split(' = ')[0]).join(' + ')}</span>` : `y[${n}] = 0  (no overlap between x[k] and h[${n}−k])`;
}
sl.oninput=()=>draw(+sl.value);
let timer=null;const pb=document.getElementById('play');
pb.onclick=()=>{
  if(timer){clearInterval(timer);timer=null;pb.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i>';return;}
  pb.innerHTML='<i class="ti ti-player-pause" aria-hidden="true"></i>';
  let n=-1;sl.value=n;draw(n);
  timer=setInterval(()=>{n++;if(n>5){clearInterval(timer);timer=null;pb.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i>';return;}sl.value=n;draw(n);},1100);
};
draw(2);
</script>
